<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6F8;color:#0B1220;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased">

<div style="flex:1;min-height:0;overflow:hidden;padding:56px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">

<div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
<div style="display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:-0.02em">
<span style="width:24px;height:24px;border-radius:6px;background:#2F55F4;display:flex;align-items:center;justify-content:center"><span style="width:12px;height:3px;border-radius:1px;background:#FFFFFF"></span></span>
Erase.me
</div>
<a href="Connect.dc.html" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E8EC;font-size:13px;font-weight:600"><span style="width:7px;height:7px;border-radius:4px;background:#14733F"></span>3 inboxes</a>
</div>

<div>
<div style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.03em">312 companies hold your data</div>
<div style="margin-top:4px;font-size:13px;color:#5B6475">Found across 3 inboxes · updated 2 min ago</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" style="min-width:0;box-sizing:border-box;padding:12px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E8EC;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:600;color:#5B6475">{{t.label}}</span>
<span style="font-size:22px;line-height:26px;font-weight:700;letter-spacing:-0.03em;color:{{t.color}}">{{t.num}}</span>
<span style="font-size:12px;line-height:15px;color:#5B6475">{{t.sub}}</span>
<sc-if value="{{t.bar}}" hint-placeholder-val="{{ false }}">
<div style="height:4px;border-radius:2px;background:#E6E8EC"><div style="width:17%;height:4px;border-radius:2px;background:#14733F"></div></div>
</sc-if>
</a>
</sc-for>
</div>

<div style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px;padding:4px 14px 2px">
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:10px 0 6px">
<span style="font-size:14px;font-weight:600">Do this next</span>
<span style="font-size:12px;color:#5B6475">4 actions</span>
</div>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EEF0F4">
<div style="width:36px;height:36px;flex:none;border-radius:8px;background:#F0F2F6;display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:14px;line-height:18px;font-weight:600">{{a.title}}</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#5B6475">{{a.sub}}</div>
</div>
<a href="{{a.href}}" style="flex:none;display:flex;align-items:center;justify-content:center;min-width:72px;min-height:44px;padding:0 12px;box-sizing:border-box;border-radius:8px;background:{{a.bg}};color:{{a.fg}};font-size:13px;font-weight:600">{{a.cta}}</a>
</div>
</sc-for>
</div>

<a href="Tracker.dc.html" style="display:block;box-sizing:border-box;padding:14px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E8EC">
<div style="display:flex;align-items:center;justify-content:space-between">
<div>
<div style="font-size:14px;font-weight:600">5 requests sent</div>
<div style="margin-top:2px;font-size:12px;color:#5B6475">2 confirmed · 2 need you · 1 waiting</div>
</div>
<span style="font-size:13px;font-weight:600;color:#2F55F4">Open</span>
</div>
<div style="margin-top:10px;height:6px;border-radius:3px;background:#E6E8EC;display:flex;overflow:hidden;gap:2px">
<div style="width:40%;background:#14733F"></div>
<div style="width:40%;background:#C62828"></div>
<div style="width:20%;background:#B8861B"></div>
</div>
</a>

</div>

<div style="flex:none;height:76px;box-sizing:border-box;display:flex;background:#FFFFFF;border-top:1px solid #E6E8EC;padding-bottom:14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:600;color:{{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      home: "M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      money: "M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01",
      shield: "M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z",
      send: "M21 3L10 14M21 3l-7 18-4-7-7-4z",
      at: "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"
    };
    const active = 'Home';
    const items = [['Home','Home.dc.html',D.home],['Money','Money.dc.html',D.money],['Exposure','KYC.dc.html',D.shield],['Requests','Tracker.dc.html',D.send],['Aliases','Leak.dc.html',D.at]];
    const soft = { bg: '#EBF0FF', fg: '#2F55F4' };
    const solid = { bg: '#2F55F4', fg: '#FFFFFF' };
    return {
      tiles: [
        { href: 'Money.dc.html', label: 'Money', num: '₹11,400', sub: 'leaking per year', color: '#0B1220', bar: false },
        { href: 'KYC.dc.html', label: 'Risk', num: '8', sub: 'hold your Aadhaar', color: '#C62828', bar: false },
        { href: 'Tracker.dc.html', label: 'Control', num: '2', sub: 'confirmed deleted', color: '#14733F', bar: true }
      ],
      actions: [
        { d: D.money, title: 'Cancel MindfulMe', sub: '₹3,599 renews Dec 4 · looks unused', cta: 'Cancel', href: 'Money.dc.html', ...soft },
        { d: D.shield, title: 'Remove your Aadhaar', sub: '4 inactive companies hold it', cta: 'Review', href: 'KYC.dc.html', ...soft },
        { d: D.send, title: 'Send 6 requests', sub: 'Drafts ready for your approval', cta: 'Approve', href: 'Approve.dc.html', ...solid },
        { d: D.at, title: 'TicketLy may have leaked you', sub: 'Its alias got 3 spam emails', cta: 'View', href: 'Leak.dc.html', ...soft }
      ],
      nav: items.map((i) => ({ label: i[0], href: i[1], d: i[2], color: i[0] === active ? '#2F55F4' : '#5B6475' }))
    };
  }
}
</script>
</body>
</html>
