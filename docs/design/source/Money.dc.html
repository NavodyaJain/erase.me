<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money leaks</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6F8;color:#0B1220;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased">

<div style="flex:1;min-height:0;overflow:hidden;padding:56px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">

<div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
<span style="font-size:22px;font-weight:700;letter-spacing:-0.03em">Money leaks</span>
<a href="Connect.dc.html" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E8EC;font-size:13px;font-weight:600"><span style="width:7px;height:7px;border-radius:4px;background:#14733F"></span>3 inboxes</a>
</div>

<div style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:13px;font-weight:500;color:#5B6475">You pay every year for</div>
<div style="font-size:40px;line-height:44px;font-weight:700;letter-spacing:-0.04em">₹11,400</div>
<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px">
<div style="width:55%;background:#2F55F4"></div>
<div style="width:45%;background:#B8861B"></div>
</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#5B6475">
<span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:#2F55F4"></span>4 in use · ₹6,300</span>
<span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:#B8861B"></span>3 look unused · ₹5,100</span>
</div>
</div>

<div style="display:flex;padding:3px;border-radius:10px;background:#E9EBF0;gap:2px">
<span style="flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#FFFFFF;border:1px solid #E1E4EA;font-size:13px;font-weight:600">All 7</span>
<span style="flex:1.3;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#5B6475">Looks unused 3</span>
<span style="flex:1.2;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#5B6475">Renews soon 2</span>
</div>

<div style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px;padding:0 14px">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:{{s.border}}">
<div style="width:36px;height:36px;flex:none;border-radius:8px;background:#F0F2F6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#0B1220">{{s.initial}}</div>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;line-height:18px;font-weight:600">{{s.name}}</span>
<sc-if value="{{s.unused}}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:#FFF3D6;color:#8A5A00;font-size:10px;font-weight:600"><span style="width:5px;height:5px;border-radius:3px;background:#8A5A00"></span>Looks unused</span></sc-if>
</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#5B6475">{{s.sub}}</div>
</div>
<div style="flex:none;display:flex;flex-direction:column;align-items:flex-end">
<span style="font-size:15px;font-weight:600">{{s.price}}</span>
<a href="Money.dc.html" style="min-height:36px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#2F55F4">Cancel</a>
</div>
</div>
</sc-for>
</div>

</div>

<div style="flex:none;height:76px;box-sizing:border-box;display:flex;background:#FFFFFF;border-top:1px solid #E6E8EC;padding-bottom:14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:600;color:{{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      home: "M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      money: "M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01",
      shield: "M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z",
      send: "M21 3L10 14M21 3l-7 18-4-7-7-4z",
      at: "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"
    };
    const active = 'Money';
    const items = [['Home','Home.dc.html',D.home],['Money','Money.dc.html',D.money],['Exposure','KYC.dc.html',D.shield],['Requests','Tracker.dc.html',D.send],['Aliases','Leak.dc.html',D.at]];
    const line = '1px solid #EEF0F4';
    return {
      subs: [
        { initial: 'M', name: 'MindfulMe', sub: 'Renews Dec 4 · yearly', price: '₹3,599', unused: true, border: 'none' },
        { initial: 'L', name: 'LinguaGo', sub: 'UPI autopay · monthly', price: '₹799', unused: true, border: line },
        { initial: 'S', name: 'StreamBox', sub: 'Renews Nov 29 · monthly', price: '₹299', unused: false, border: line },
        { initial: 'C', name: 'CloudVault', sub: 'Renews Jan 12 · yearly', price: '₹1,900', unused: true, border: line },
        { initial: 'F', name: 'FitTrack Pro', sub: 'Renews Feb 2 · yearly', price: '₹2,400', unused: false, border: line }
      ],
      nav: items.map((i) => ({ label: i[0], href: i[1], d: i[2], color: i[0] === active ? '#2F55F4' : '#5B6475' }))
    };
  }
}
</script>
</body>
</html>
