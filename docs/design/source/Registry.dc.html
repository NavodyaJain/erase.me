<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who honors deletion</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6F8;color:#0B1220;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased">

<div style="flex:1;min-height:0;overflow:hidden;padding:48px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:4px;min-height:44px;margin-left:-8px">
<a href="Tracker.dc.html" aria-label="Back to requests" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<span style="font-size:15px;font-weight:600;color:#5B6475">Requests</span>
</div>

<div>
<div style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.03em">Who honors deletion</div>
<div style="margin-top:4px;font-size:14px;line-height:20px;color:#5B6475">Company scoreboard, built from real requests sent through Erase.me.</div>
</div>

<div style="display:flex;padding:3px;border-radius:10px;background:#E9EBF0;gap:2px">
<span style="flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#FFFFFF;border:1px solid #E1E4EA;font-size:13px;font-weight:600">Best</span>
<span style="flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#5B6475">Slowest</span>
<span style="flex:1.3;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#5B6475">Never replies</span>
</div>

<div style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px;padding:0 14px">
<sc-for list="{{cos}}" as="c" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:{{c.border}}">
<span style="width:20px;flex:none;font-size:13px;font-weight:600;color:#5B6475">{{c.rank}}</span>
<div style="flex:1;min-width:0">
<div style="font-size:14px;line-height:18px;font-weight:600">{{c.name}}</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#5B6475">{{c.sub}}</div>
<div style="margin-top:8px;height:4px;border-radius:2px;background:#E6E8EC"><div style="width:{{c.pct}};height:4px;border-radius:2px;background:{{c.fg}}"></div></div>
</div>
<div style="flex:none;width:56px;text-align:right">
<div style="font-size:20px;line-height:24px;font-weight:700;letter-spacing:-0.03em;color:{{c.fg}}">{{c.rate}}</div>
<div style="font-size:10px;color:#5B6475">honored</div>
</div>
</div>
</sc-for>
</div>

<div style="font-size:12px;line-height:17px;color:#5B6475">Rates are shown only once a company has 10 or more requests.</div>

</div>

<div style="flex:none;height:76px;box-sizing:border-box;display:flex;background:#FFFFFF;border-top:1px solid #E6E8EC;padding-bottom:14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:600;color:{{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      home: "M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      money: "M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01",
      shield: "M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z",
      send: "M21 3L10 14M21 3l-7 18-4-7-7-4z",
      at: "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"
    };
    const active = 'Requests';
    const items = [['Home','Home.dc.html',D.home],['Money','Money.dc.html',D.money],['Exposure','KYC.dc.html',D.shield],['Requests','Tracker.dc.html',D.send],['Aliases','Leak.dc.html',D.at]];
    const good = '#14733F', mid = '#8A5A00', bad = '#C62828';
    const line = '1px solid #EEF0F4';
    return {
      cos: [
        { rank: '1', name: 'ShopHive', sub: 'Replies in 3 days · 41 requests', rate: '94%', pct: '94%', fg: good, border: 'none' },
        { rank: '2', name: 'PayNest', sub: 'Replies in 6 days · 28 requests', rate: '88%', pct: '88%', fg: good, border: line },
        { rank: '3', name: 'TradeLeaf', sub: 'Replies in 12 days · 19 requests', rate: '61%', pct: '61%', fg: mid, border: line },
        { rank: '4', name: 'WorkNook', sub: 'Replies in 19 days · 14 requests', rate: '43%', pct: '43%', fg: mid, border: line },
        { rank: '5', name: 'QuickCash', sub: 'Often no reply · 33 requests', rate: '18%', pct: '18%', fg: bad, border: line }
      ],
      nav: items.map((i) => ({ label: i[0], href: i[1], d: i[2], color: i[0] === active ? '#2F55F4' : '#5B6475' }))
    };
  }
}
</script>
</body>
</html>
