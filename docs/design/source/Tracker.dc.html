<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request tracker</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6F8;color:#0B1220;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased">

<div style="flex:1;min-height:0;overflow:hidden;padding:56px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
<span style="font-size:22px;font-weight:700;letter-spacing:-0.03em">Requests</span>
<a href="Registry.dc.html" style="display:flex;align-items:center;min-height:44px;font-size:13px;font-weight:600;color:#2F55F4">Who honors deletion</a>
</div>

<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="padding:12px 12px;border-left:{{s.border}}">
<div style="font-size:24px;line-height:28px;font-weight:700;letter-spacing:-0.03em;color:{{s.color}}">{{s.num}}</div>
<div style="margin-top:2px;font-size:12px;color:#5B6475">{{s.label}}</div>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#FFF3D6;border:1px solid #F0DBA3">
<div style="flex:1;min-width:0">
<div style="font-size:14px;line-height:18px;font-weight:600;color:#3D2A00">QuickCash has not replied</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#6B4B00">Day 21 of 30 · follow-up ready</div>
</div>
<a href="Tracker.dc.html" style="flex:none;min-height:44px;padding:0 16px;border-radius:8px;background:#0B1220;color:#FFFFFF;display:flex;align-items:center;font-size:13px;font-weight:600">Chase now</a>
</div>

<div style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:12px;padding:0 14px">
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:{{r.border}}">
<div style="width:36px;height:36px;flex:none;border-radius:8px;background:#F0F2F6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">{{r.initial}}</div>
<div style="flex:1;min-width:0">
<div style="font-size:14px;line-height:18px;font-weight:600">{{r.name}}</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#5B6475;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{r.sub}}</div>
</div>
<div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
<span style="display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:{{r.bg}};color:{{r.fg}};font-size:10px;font-weight:600"><span style="width:5px;height:5px;border-radius:3px;background:{{r.fg}}"></span>{{r.status}}</span>
<span style="display:flex;gap:2px"><span style="width:16px;height:3px;border-radius:2px;background:{{r.s1}}"></span><span style="width:16px;height:3px;border-radius:2px;background:{{r.s2}}"></span><span style="width:16px;height:3px;border-radius:2px;background:{{r.s3}}"></span></span>
</div>
</div>
</sc-for>
</div>

<div style="display:flex;justify-content:space-between;font-size:11px;color:#5B6475;margin:-6px 4px 0"><span>Sent</span><span>Replied</span><span>Deleted</span></div>

<a href="Tracker.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:10px;border:1px solid #D5D9E0;background:#FFFFFF;font-size:14px;font-weight:600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"></path></svg>
Download proof pack (PDF)
</a>

</div>

<div style="flex:none;height:76px;box-sizing:border-box;display:flex;background:#FFFFFF;border-top:1px solid #E6E8EC;padding-bottom:14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:600;color:{{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      home: "M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
      money: "M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01",
      shield: "M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z",
      send: "M21 3L10 14M21 3l-7 18-4-7-7-4z",
      at: "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"
    };
    const active = 'Requests';
    const items = [['Home','Home.dc.html',D.home],['Money','Money.dc.html',D.money],['Exposure','KYC.dc.html',D.shield],['Requests','Tracker.dc.html',D.send],['Aliases','Leak.dc.html',D.at]];
    const g = '#14733F', a = '#B8861B', b = '#2F55F4', n = '#D5D9E0';
    const done = { fg: '#14733F', bg: '#E6F4EC', s1: g, s2: g, s3: g, status: 'Deleted' };
    const replied = { fg: '#2F55F4', bg: '#EBF0FF', s1: b, s2: b, s3: n, status: 'Replied' };
    const wait = { fg: '#8A5A00', bg: '#FFF3D6', s1: a, s2: n, s3: n, status: 'Waiting' };
    const line = '1px solid #EEF0F4';
    return {
      stats: [
        { num: '5', label: 'Sent', color: '#0B1220', border: 'none' },
        { num: '2', label: 'Deleted', color: '#14733F', border: '1px solid #E6E8EC' },
        { num: '1', label: 'Replied', color: '#2F55F4', border: '1px solid #E6E8EC' },
        { num: '2', label: 'Waiting', color: '#8A5A00', border: '1px solid #E6E8EC' }
      ],
      reqs: [
        { initial: 'P', name: 'PayNest', sub: 'Confirmed deletion · Nov 9', ...done, border: 'none' },
        { initial: 'S', name: 'ShopHive', sub: 'Confirmed deletion · Nov 11', ...done, border: line },
        { initial: 'T', name: 'TradeLeaf', sub: 'Asked for ID proof · reply needed', ...replied, border: line },
        { initial: 'Q', name: 'QuickCash', sub: 'Sent Oct 23 · no reply', ...wait, border: line },
        { initial: 'W', name: 'WorkNook', sub: 'Sent Nov 6 · due Dec 6', ...wait, border: line }
      ],
      nav: items.map((i) => ({ label: i[0], href: i[1], d: i[2], color: i[0] === active ? '#2F55F4' : '#5B6475' }))
    };
  }
}
</script>
</body>
</html>
